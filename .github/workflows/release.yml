name: Build releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Ícones do app
        run: |
          pip install pillow
          python build/preparar-icones.py

      - name: Testes
        run: python -m unittest discover -s tests -v

      - name: PyInstaller
        run: pyinstaller build/webrp-extrator.spec --noconfirm

      - name: Smoke test do executável
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $processo = Start-Process "dist\WebRP-Extrator\WebRP-Extrator.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($processo.HasExited) {
            Write-Error "O executável encerrou antes de abrir (código $($processo.ExitCode))."
            exit 1
          }
          Stop-Process -Id $processo.Id -Force

      - name: Chromium do Playwright (embutido na pasta)
        shell: pwsh
        run: |
          $browsers = "$PWD/dist/WebRP-Extrator/ms-playwright"
          New-Item -ItemType Directory -Force -Path $browsers | Out-Null
          $env:PLAYWRIGHT_BROWSERS_PATH = $browsers
          python -m playwright install chromium --no-shell
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(channel='chromium', headless=True); b.close(); p.stop(); print('Chromium: OK')"

      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\windows-setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: WebRP-Extrator-windows
          path: WebRP-Extrator-Setup.exe
          retention-days: 30

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências do sistema (Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-0 libgl1 libegl1 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxkbcommon-x11-0

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Ícones do app
        run: |
          pip install pillow
          python build/preparar-icones.py

      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: PyInstaller
        run: pyinstaller build/webrp-extrator.spec --noconfirm

      - name: Smoke test do executável
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout 8s dist/WebRP-Extrator/WebRP-Extrator
          CODIGO=$?
          set -e
          if [[ "$CODIGO" -ne 124 ]]; then
            echo "O executável encerrou antes de abrir (código $CODIGO)."
            exit 1
          fi

      - name: Chromium do Playwright (embutido na pasta)
        run: |
          mkdir -p dist/WebRP-Extrator/ms-playwright
          PLAYWRIGHT_BROWSERS_PATH="$PWD/dist/WebRP-Extrator/ms-playwright" \
            python -m playwright install chromium --no-shell
          PLAYWRIGHT_BROWSERS_PATH="$PWD/dist/WebRP-Extrator/ms-playwright" \
            python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(channel='chromium', headless=True); b.close(); p.stop(); print('Chromium: OK')"

      - name: Resolver versão
        id: versao
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            V=$(python -c "from src.config import VERSAO; print(VERSAO)")
          fi
          echo "numero=$V" >> "$GITHUB_OUTPUT"

      - name: Pacote .deb (Ubuntu/Debian — instalador)
        run: |
          chmod +x build/criar-deb-linux.sh
          VERSAO="${{ steps.versao.outputs.numero }}" ./build/criar-deb-linux.sh

      - name: AppImage (alternativa portátil)
        run: |
          chmod +x build/criar-appimage-linux.sh
          VERSAO="${{ steps.versao.outputs.numero }}" ./build/criar-appimage-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: WebRP-Extrator-linux
          path: |
            WebRP-Extrator_amd64.deb
            WebRP-Extrator-x86_64.AppImage
          retention-days: 30

  publish-release:
    name: Publicar no GitHub Releases
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Gerar checksums
        run: |
          sha256sum \
            WebRP-Extrator-Setup.exe \
            WebRP-Extrator_amd64.deb \
            WebRP-Extrator-x86_64.AppImage > SHA256SUMS.txt

      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WebRP-Extrator-Setup.exe
            WebRP-Extrator_amd64.deb
            WebRP-Extrator-x86_64.AppImage
            SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
