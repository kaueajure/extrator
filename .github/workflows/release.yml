name: Build releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: PyInstaller
        run: pyinstaller build/webrp-extrator.spec --noconfirm

      - name: Chromium do Playwright (embutido na pasta)
        shell: pwsh
        run: |
          $browsers = "$PWD/dist/WebRP-Extrator/ms-playwright"
          New-Item -ItemType Directory -Force -Path $browsers | Out-Null
          $env:PLAYWRIGHT_BROWSERS_PATH = $browsers
          python -m playwright install chromium

      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\windows-setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: WebRP-Extrator-windows
          path: WebRP-Extrator-Setup.exe
          retention-days: 30

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências do sistema (Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: PyInstaller
        run: pyinstaller build/webrp-extrator.spec --noconfirm

      - name: Chromium do Playwright (embutido na pasta)
        run: |
          mkdir -p dist/WebRP-Extrator/ms-playwright
          PLAYWRIGHT_BROWSERS_PATH="$PWD/dist/WebRP-Extrator/ms-playwright" \
            python -m playwright install chromium

      - name: Instalador .run
        run: |
          chmod +x build/criar-instalador-linux.sh build/webrp-extrator.sh
          VERSAO=1.2.0 ./build/criar-instalador-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: WebRP-Extrator-linux
          path: WebRP-Extrator-Setup.run
          retention-days: 30

  publish-release:
    name: Publicar no GitHub Releases
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WebRP-Extrator-Setup.exe
            WebRP-Extrator-Setup.run
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
